<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00C6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0072FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0072FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00C6FF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagon icon centered -->
  <g transform="translate(25, 25)">
    <polygon points="35,0 65,17 65,52 35,69 5,52 5,17"
             fill="none" stroke="url(#grad1)" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Inner connection lines representing a network/nexus -->
    <line x1="35" y1="0" x2="35" y2="69" stroke="url(#grad2)" stroke-width="2" opacity="0.6"/>
    <line x1="5" y1="17" x2="65" y2="52" stroke="url(#grad2)" stroke-width="2" opacity="0.6"/>
    <line x1="65" y1="17" x2="5" y2="52" stroke="url(#grad2)" stroke-width="2" opacity="0.6"/>
    <!-- Center dot -->
    <circle cx="35" cy="34.5" r="5" fill="url(#grad1)" filter="url(#glow)"/>
  </g>
</svg>